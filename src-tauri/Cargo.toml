[package]
name = "Joinery"
version = "0.1.0"
edition = "2021"
description = "Privacy-first local data analytics powered by DuckDB."
authors = ["Joinery Labs"]
license = "Apache-2.0"
repository = "https://github.com/joinery-labs/joinery"
homepage = "https://github.com/joinery-labs/joinery"
readme = "../README.md"
keywords = ["duckdb", "sql", "data-analytics", "sql-workbench"]
categories = ["development-tools", "database"]
rust-version = "1.70"

[lib]
name = "joinery_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
duckdb = { version = "1.4.0", features = ["bundled", "appender-arrow", "vtab-arrow"] }
arrow = { version = "56", default-features = false, features = ["ipc"] }
tempfile = "3"
base64 = "0.22"
thiserror = "1"
log = "0.4"
env_logger = "0.11"